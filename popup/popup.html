<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dual Subtitles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Dual Subtitles <span class="langs">DE · EN</span></h1>
    <label class="switch" title="Show German + English subtitles on YouTube">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>
  <p class="status" id="status"></p>

  <section class="settings">
    <h2>Display</h2>
    <div class="setting">
      <span class="label">Font size</span>
      <div class="segmented" data-setting="fontSize">
        <label><input type="radio" name="fontSize" value="S"><span>S</span></label>
        <label><input type="radio" name="fontSize" value="M"><span>M</span></label>
        <label><input type="radio" name="fontSize" value="L"><span>L</span></label>
        <label><input type="radio" name="fontSize" value="XL"><span>XL</span></label>
      </div>
    </div>
    <div class="setting">
      <span class="label">Position</span>
      <div class="segmented" data-setting="position">
        <label><input type="radio" name="position" value="bottom"><span>Bottom</span></label>
        <label><input type="radio" name="position" value="higher"><span>Higher</span></label>
        <label><input type="radio" name="position" value="top"><span>Top</span></label>
      </div>
    </div>
    <label class="setting checkbox">
      <span class="label">Show English translation</span>
      <input type="checkbox" id="showEnglish">
    </label>
  </section>

  <section>
    <div class="list-head">
      <h2>Vocab list <span id="count"></span></h2>
      <button id="export" disabled>Export CSV</button>
    </div>
    <p class="empty" id="empty" hidden>
      Nothing saved yet. On YouTube, click ☆ on a subtitle (or press Alt+S) to save a sentence,
      or click a German word and choose “Save word”.
    </p>
    <ul id="list"></ul>
  </section>

  <script src="../src/vocab.js"></script>
  <script src="../src/settings.js"></script>
  <script src="csv.js"></script>
  <script src="popup.js"></script>
</body>
</html>
